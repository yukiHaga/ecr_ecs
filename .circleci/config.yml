version: 2.1
orbs:
  aws-cli: circleci/aws-cli@5.1
  aws-ecr: circleci/aws-ecr@9.7.0
  aws-ecs: circleci/aws-ecs@7.1.0

workflows:
  build-and-push-image-with-container-registry-login:
    jobs:
      - aws-ecr/build_and_push_image:
          account_id: '${AWS_ACCOUNT_ID}'
          auth:
            - aws-cli/setup:
                role_arn: '${CIRCLECI_OIDC_ROLE_ARN}'
          dockerfile: Dockerfile
          path: .
          region: '${AWS_REGION}'
          repo: 'nginx'
          tag: '${CIRCLE_SHA1}'
          context: AWS

      ### ECSへデプロイするジョブ
      - aws-ecs/deploy_service_update:
          requires:
            - aws-ecr/build_and_push_image
          auth:
            - aws-cli/setup:
                role_arn: '${CIRCLECI_OIDC_ROLE_ARN}'
          cluster: 'circleci-book-cluster'
          container_image_name_updates: 'container=circleci-book-container,image-and-tag=${AWS_ECR_ACCOUNT_URL}/nginx:${CIRCLE_SHA1}'
          family: 'circleci-book-task'
          region: '${AWS_REGION}'
          context: AWS

